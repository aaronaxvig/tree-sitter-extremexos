name: Native parser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run generate
      - run: git diff --exit-code -- src
      - run: npm test
      - run: python3 -B -m unittest discover -s test/tools
      - run: npx --no-install tree-sitter parse --quiet examples/example.exos test/fixtures/*.exos
      - run: cc -Werror=overflow -fsyntax-only -Isrc src/parser.c
