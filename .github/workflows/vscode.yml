name: VS Code extension

on:
  pull_request:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ['vscode-v*']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Check generated highlighting
        run: |
          npm run generate
          git diff --exit-code -- syntaxes
      - run: npm test
      - name: Package tagged version
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "vscode-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version $version"
            exit 1
          fi
          archive="extremexos-$version.vsix"
          npm run package -- --out "$archive"
          unzip -p "$archive" extension/LICENSE.md | cmp LICENSE.md -
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
      - name: Attach tested extension to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=${GITHUB_REF_NAME#vscode-v}
          archive="extremexos-$version.vsix"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --draft \
              --title "ExtremeXOS for VS Code $version" --generate-notes
          fi

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: editors/vscode
      - name: Download reviewed release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./editors/vscode/package.json').version")
          [[ "$TAG" == "vscode-v$version" ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "extremexos-$version.vsix" --dir "$RUNNER_TEMP"
      - name: Publish release package to Visual Studio Marketplace
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd "$RUNNER_TEMP"
          npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "extremexos-${TAG#vscode-v}.vsix"
